<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🌈 Kids Fun & Learn Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Comic Sans MS, Arial;
}

.game {
  width: 360px;
  min-height: 640px;
  background: white;
  border-radius: 30px;
  padding: 15px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  text-align: center;
}

h1 { color: #ff4081; font-size: 22px; margin: 5px 0; }

.stats {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
}

.board {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-top: 15px;
}

.card {
  height: 100px;
  border-radius: 20px;
  font-size: 42px;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  transition: transform 0.1s;
}

.card:active { transform: scale(0.9); }

.red { background:#ff5252 }
.blue { background:#448aff }
.green { background:#4caf50 }
.yellow { background:#ffeb3b }
.purple { background:#9c27b0 }
.orange { background:#ff9800 }

.controls {
  margin-top: 10px;
  display: flex;
  justify-content: space-between;
}

button {
  border: none;
  padding: 8px;
  border-radius: 10px;
  background: #ff4081;
  color: white;
  font-size: 12px;
  cursor: pointer;
}

footer {
  font-size: 11px;
  margin-top: 5px;
  color: #777;
}
</style>
</head>

<body>

<div class="game">
  <h1>🌈 Kids Fun & Learn</h1>

  <div class="stats">
    <div>⭐ Stars: <span id="stars">0</span></div>
    <div>🎁 Level: <span id="level">1</span></div>
    <div>🏆 Badges: <span id="badges">0</span></div>
  </div>

  <div class="board" id="board">
    <div class="card red" onclick="tap('dog')">🐶</div>
    <div class="card blue" onclick="tap('cat')">🐱</div>
    <div class="card green" onclick="tap('cow')">🐮</div>
    <div class="card yellow" onclick="tap('lion')">🦁</div>
    <div class="card purple" onclick="tap('sheep')">🐑</div>
    <div class="card orange" onclick="tap('pig')">🐷</div>
    <div class="card red" onclick="tap('monkey')">🐵</div>
    <div class="card blue" onclick="tap('elephant')">🐘</div>
    <div class="card green" onclick="tap('frog')">🐸</div>
    <div class="card yellow" onclick="tap('owl')">🦉</div>
  </div>

  <div class="controls">
    <button onclick="learningMode()">📚 Learn</button>
    <button onclick="parentLock()">🔒 Parent</button>
  </div>

  <footer>Tap animals & numbers daily for rewards!</footer>
</div>

<script>
// Game variables
let stars = 0, level = 1, badges = 0, locked = false;

const starsEl = document.getElementById("stars");
const levelEl = document.getElementById("level");
const badgesEl = document.getElementById("badges");

// Sounds for animals
const sounds = {
  dog: "https://actions.google.com/sounds/v1/animals/dog_bark.ogg",
  cat: "https://actions.google.com/sounds/v1/animals/cat_purr_close.ogg",
  cow: "https://actions.google.com/sounds/v1/animals/cow.ogg",
  lion: "https://actions.google.com/sounds/v1/animals/lion_roar.ogg",
  sheep: "https://actions.google.com/sounds/v1/animals/sheep.ogg",
  pig: "https://actions.google.com/sounds/v1/animals/pig.ogg",
  monkey: "https://actions.google.com/sounds/v1/animals/monkey.ogg",
  elephant: "https://actions.google.com/sounds/v1/animals/elephant.ogg",
  frog: "https://actions.google.com/sounds/v1/animals/frog.ogg",
  owl: "https://actions.google.com/sounds/v1/animals/owl.ogg"
};

// Preload
const preloadedSounds = {};
for(let key in sounds) {
  preloadedSounds[key] = new Audio(sounds[key]);
}

// Tap function
function tap(animal) {
  if (locked) return;

  stars++;
  starsEl.textContent = stars;

  const sound = preloadedSounds[animal];
  sound.currentTime = 0;
  sound.play().catch(e => console.log("Audio blocked:", e));

  // Level up every 10 stars
  if(stars % 10 === 0) {
    level++;
    levelEl.textContent = level;
    alert("🎉 Level Up!");
  }

  // Badge reward every 25 stars
  if(stars % 25 === 0) {
    badges++;
    badgesEl.textContent = badges;
    alert("🏆 Badge Earned!");
  }

  if(navigator.vibrate) navigator.vibrate(50);
}

// Learning mode
function learningMode() {
  alert("📚 Learning Mode: Tap animals to hear their sounds.");
}

// Parent lock
function parentLock() {
  const code = prompt("Parent code?");
  if(code==="1234") {
    locked = !locked;
    alert(locked?"🔒 Locked":"🔓 Unlocked");
  }
}

// Service worker
if("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/kids-game/sw.js").catch(console.log);
}

// Optional: daily joke/number reward
function dailyReward() {
  const today = new Date().toDateString();
  if(localStorage.getItem("lastReward")!==today) {
    stars += 5;
    starsEl.textContent = stars;
    localStorage.setItem("lastReward", today);
    alert("🎁 Daily Reward: +5 Stars!");
  }
}
dailyReward();
</script>

</body>
</html>
